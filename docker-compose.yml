services:
  db:
    build:
      context: components/db/containers/postgis
      dockerfile: Containerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: ghcr.io/nlsfi/pinta/db:latest
    healthcheck:
      test: pg_isready -U postgres || exit 1
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    environment:
      POSTGIS_GDAL_ENABLED_DRIVERS: "ENABLE_ALL"
    ports:
      - target: 5432
        published: "${COMPOSE_DB_PORT:-5400}"
        protocol: tcp
        mode: host
    volumes:
      - type: volume
        source: db-data
        target: /pgdata

  processing:
    build:
      context: .
      dockerfile: components/processing/Containerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: ghcr.io/nlsfi/pinta/processing:latest
    volumes:
      - type: bind
        source: ${REPO_DIR:-.}
        target: /code
        read_only: true

  qgis:
    profiles:
      - e2e
    depends_on:
      - db
    build:
      context: .
      dockerfile: components/e2e/Containerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: ghcr.io/nlsfi/pinta/e2e:latest
    env_file:
      - ".env.example"
      - ".env.e2e"
    volumes:
      - type: bind
        source: ${REPO_DIR:-.}/components
        target: /components
        read_only: true

  tbls:
    # DB documentation tool
    profiles:
      - documentation
    depends_on:
      - db
    image: ghcr.io/k1low/tbls:v1.94.5
    env_file:
      - ".env.example"
      - ".env.e2e"
    working_dir: /db
    volumes:
      - type: bind
        source: ${REPO_DIR:-.}/components/db
        target: /db
        read_only: false

volumes:
  db-data:
