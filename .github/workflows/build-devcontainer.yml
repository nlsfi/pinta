name: Build Devcontainer Container

on:
  push:
    branches: [ main ]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/build-devcontainer.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GHCR_PREFIX: ghcr.io/nlsfi/pinta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        run: |
          set -euo pipefail

          docker buildx build --load \
            -f .devcontainer/Containerfile \
            -t pinta/devcontainer:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            .devcontainer

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push to GHCR
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          docker tag pinta/devcontainer:latest "$GHCR_PREFIX/devcontainer:latest"
          docker push "$GHCR_PREFIX/devcontainer:latest"

      - name: Show built images
        run: |
          docker image ls --filter reference='pinta/devcontainer:*'
          docker image ls --filter reference="$GHCR_PREFIX/devcontainer:*"
