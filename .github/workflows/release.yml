name: Release

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Publish to test PyPI instead of PyPi and do not push or create tags.'
        required: true
        default: false
        type: boolean

jobs:
  # Components are released one after another in dependency order (lib -> db -> processing, backend ->
  # qgis_plugin, dags) in a single job, because each release pushes a commit to the same branch.
  # A component is released if it has feat/fix commits. When a component is released, its dependents get a fix
  # commit that raises the version requirement, which makes them releasable as well.
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
    env:
      UV_PUBLISH_INDEX: ${{ inputs.test_mode && 'testpypi' || 'pypi' }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Release lib
        id: lib
        uses: ./.github/actions/release-component
        with:
          component: lib
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ !inputs.test_mode }}

      - name: Release db
        id: db
        uses: ./.github/actions/release-component
        with:
          component: db
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ !inputs.test_mode }}

      - name: Release processing
        id: processing
        uses: ./.github/actions/release-component
        with:
          component: processing
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ !inputs.test_mode }}

      - name: Release backend
        id: backend
        uses: ./.github/actions/release-component
        with:
          component: backend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ !inputs.test_mode }}

      - name: Release qgis_plugin
        id: qgis_plugin
        uses: ./.github/actions/release-component
        with:
          component: qgis_plugin
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ !inputs.test_mode }}

      - name: Release dags
        id: dags
        uses: ./.github/actions/release-component
        with:
          component: dags
          github_token: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ !inputs.test_mode }}

  notify-teams:
    needs: release
    if: ${{ always() && needs.release.result == 'failure' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Release
    secrets: inherit
