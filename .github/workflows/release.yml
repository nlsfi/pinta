name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build release packages and images without publishing them
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi-release
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Release Python packages
        id: release
        uses: nlsfi/python-monorepo-release-action@v1.0.0
        with:
          components: |
            lib
            db
            processing
            backend
            qgis_plugin
            dags
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: ${{ inputs.dry_run }}

      - name: Resolve release image versions
        id: image-versions
        shell: bash
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          for component in backend processing; do
            version="$(python3 -c \
              'import json, os, sys; print(json.loads(os.environ["RELEASES"]).get(sys.argv[1], ""))' \
              "$component")"

            if [ -z "$version" ] && [ "$DRY_RUN" != "true" ]; then
              tag="$(git tag --list "pinta-$component-v*" --sort=-version:refname | sed -n '1p')"
              if [ -n "$tag" ]; then
                version="${tag##*-v}"
              fi
            fi

            echo "${component}_version=$version" >> "$GITHUB_OUTPUT"
          done

      - name: Set up QEMU
        if: >-
          steps.image-versions.outputs.backend_version != '' ||
          steps.image-versions.outputs.processing_version != ''
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: >-
          steps.image-versions.outputs.backend_version != '' ||
          steps.image-versions.outputs.processing_version != ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        if: >-
          inputs.dry_run != true &&
          (steps.image-versions.outputs.backend_version != '' ||
          steps.image-versions.outputs.processing_version != '')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish backend release image
        if: steps.image-versions.outputs.backend_version != ''
        uses: ./.github/actions/publish-release-image
        with:
          component: backend
          version: ${{ steps.image-versions.outputs.backend_version }}
          dry_run: ${{ inputs.dry_run }}

      - name: Publish processing release image
        if: steps.image-versions.outputs.processing_version != ''
        uses: ./.github/actions/publish-release-image
        with:
          component: processing
          version: ${{ steps.image-versions.outputs.processing_version }}
          dry_run: ${{ inputs.dry_run }}

  notify-teams:
    needs: release
    if: ${{ always() && needs.release.result == 'failure' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Release
    secrets: inherit
