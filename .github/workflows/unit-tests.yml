name: Test Unit
on:
  workflow_call:
    inputs:
      component-path:
        required: true
        type: string
      test_folder:
        required: true
        type: string
      head_branch:
        description: Source branch for notification routing
        required: true
        type: string

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.component-path }}
    env:
      COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Create virtualenv and install dependencies
        run: |
          uv sync --locked --all-packages --all-groups --all-extras \
            --no-group qgis --no-extra qgis

      - name: Copy .env.example to .env
        run: cp ../../.env.example ../../.env

      - name: Run tests
        run: |
          uv run --no-sync coverage run -m pytest -v ${{ inputs.test_folder }}

      - name: Upload coverage fragment
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.test_folder }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  notify-teams:
    needs: unit-tests
    if: ${{ always() && needs.unit-tests.result == 'failure' && inputs.head_branch == 'main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Unit test ${{ inputs.component-path }}
    secrets: inherit
