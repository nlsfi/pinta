name: Backend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'components/backend/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/backend/**'
      - '.github/workflows/backend.yml'
      - '.github/workflows/unit-tests.yml'

jobs:
  unittests:
    uses: ./.github/workflows/unit-tests.yml
    with:
      component-path: components/backend
      test_folder: test_backend
  notify-teams:
    needs: unittests
    if: ${{ always() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Backend tests
    secrets: inherit
