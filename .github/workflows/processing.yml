name: Processing Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'components/processing/**'
      - '.github/workflows/processing.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/processing/**'
      - '.github/workflows/processing.yml'

jobs:
  unittests:
    uses: ./.github/workflows/unit-tests.yml
    with:
      component-path: components/processing
      test_folder: test_processing
  notify-teams:
    needs: unittests
    if: ${{ always() && needs.unittests.result == 'failure' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Processing unit tests
    secrets: inherit
