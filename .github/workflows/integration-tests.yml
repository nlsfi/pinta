name: Test Integration

on:
  push:
    branches: [ main ]
    paths:
      - 'components/dags/**'
      - 'components/processing/**'
      - 'components/backend/**'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'components/dags/**'
      - 'components/processing/**'
      - 'components/backend/**'
      - '.github/workflows/integration-tests.yml'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Build all compose images
        env:
          COMPOSE_PROFILES: "*"
        run: |
          docker buildx bake \
            --file docker-compose.yml \
            --load \
            --set "*.cache-from=type=gha" \
            --set "*.cache-to=type=gha,mode=max"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Start database
        run: make up-db

      - name: Run migrations
        run: make db-migrate-all

      - name: Install LASTools runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjpeg62 \
            libpng16-16t64 \
            libtiff6 \
            libgeotiff5 \
            libwebp7

      - name: Download LASTools binaries
        run: |
          mkdir -p external/LAStools
          curl -fsSL https://downloads.rapidlasso.de/LAStools.tar.gz \
            -o /tmp/lastools.tar.gz
          tar -xzf /tmp/lastools.tar.gz -C external/LAStools
          rm /tmp/lastools.tar.gz

      - name: Run tests
        run: |
          make test-integration

  notify-teams:
    needs: integration-tests
    if: ${{ always() && needs.integration-tests.result == 'failure' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Integration tests
    secrets: inherit
