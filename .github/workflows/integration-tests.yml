name: Integration tests

# Reusable workflow for running integration tests against candidate images
# built and pushed by build-containers.yml.
on:
  workflow_call:
    inputs:
      candidate_tag:
        description: Candidate container image tag to test
        required: true
        type: string
      candidate_sha:
        description: Git SHA matching the candidate images
        required: true
        type: string
      head_branch:
        description: Source branch for notification routing
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    env:
      PINTA_IMAGE_TAG: ${{ inputs.candidate_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Pull candidate images
        run: docker compose pull processing airflow backend

      - name: Build empty database image
        run: docker compose build db

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Start database
        run: make up-db

      - name: Disable autovacuum
        run: docker compose exec -T db psql -U postgres -c "ALTER SYSTEM SET autovacuum = off" -c "SELECT pg_reload_conf();"

      - name: Run migrations
        run: make db-migrate-all

      - name: Install LASTools runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjpeg62 \
            libpng16-16t64 \
            libtiff6 \
            libgeotiff5 \
            libwebp7

      - name: Download LASTools binaries
        run: |
          mkdir -p external/LAStools
          curl -fsSL --retry 5 --retry-delay 15 --retry-all-errors https://raw.githubusercontent.com/LAStools/LAStools.github.io/5bfd81f57975b312b893135f613417acbc698cbe/download/LAStools.tar.gz \
            -o /tmp/lastools.tar.gz
          tar -xzf /tmp/lastools.tar.gz -C external/LAStools
          rm /tmp/lastools.tar.gz

      - name: Run tests
        run: |
          make test-integration

  notify-teams:
    needs: integration-tests
    if: ${{ always() && needs.integration-tests.result == 'failure' && inputs.head_branch == 'main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Integration tests
    secrets: inherit
