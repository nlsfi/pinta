name: Cleanup candidate images

on:
  schedule:
    - cron: "00 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GHCR_PREFIX: ghcr.io/nlsfi/pinta
      GHCR_OWNER: nlsfi
      GHCR_REPOSITORY_PREFIX: pinta
    steps:
      - name: Remove stale candidate tags
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_DELETE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '7 days ago' +%s)"

          registry_token() {
            local image="$1"
            curl -fsSL \
              -u "${{ github.actor }}:${{ github.token }}" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${GHCR_OWNER}/${GHCR_REPOSITORY_PREFIX}/${image}:pull,delete" \
              | jq -r '.token'
          }

          registry_get() {
            local token="$1"
            local path="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${GHCR_OWNER}/${GHCR_REPOSITORY_PREFIX}/${path}"
          }

          image_created_at() {
            local token="$1"
            local image="$2"
            local tag="$3"
            local manifest child_digest config_digest

            manifest="$(registry_get "$token" "${image}/manifests/${tag}")"
            config_digest="$(jq -r '.config.digest // empty' <<< "$manifest")"

            if [ -z "$config_digest" ]; then
              child_digest="$(jq -r '.manifests[0].digest // empty' <<< "$manifest")"
              if [ -z "$child_digest" ]; then
                return 1
              fi

              manifest="$(registry_get "$token" "${image}/manifests/${child_digest}")"
              config_digest="$(jq -r '.config.digest // empty' <<< "$manifest")"
            fi

            if [ -z "$config_digest" ]; then
              return 1
            fi

            registry_get "$token" "${image}/blobs/${config_digest}" | jq -r '.created // empty'
          }

          github_api() {
            curl -fsSL \
              -H "Authorization: Bearer ${PACKAGES_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          delete_tag() {
            local image="$1"
            local tag="$2"
            local package_name="${GHCR_REPOSITORY_PREFIX}%2F${image}"
            local version_id version_url page result count http_code

            version_id=""
            version_url=""
            page=1
            while [ -z "$version_id" ]; do
              result="$(github_api "https://api.github.com/orgs/${GHCR_OWNER}/packages/container/${package_name}/versions?per_page=100&page=${page}")"
              count="$(jq 'length' <<< "$result")"
              [ "$count" -eq 0 ] && break
              version_id="$(jq -r --arg tag "$tag" '[.[] | select(.metadata.container.tags[]? == $tag)] | first | .id // empty' <<< "$result")"
              version_url="$(jq -r --arg tag "$tag" '[.[] | select(.metadata.container.tags[]? == $tag)] | first | .url // empty' <<< "$result")"
              page=$((page + 1))
            done

            if [ -z "$version_id" ]; then
              echo "Warning: could not find version ID for ${image}:${tag}, skipping"
              return 0
            fi

            echo "  version_id=${version_id} url=${version_url}"
            http_code="$(
              curl -sSL -X DELETE \
                -H "Authorization: Bearer ${PACKAGES_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -o /dev/null \
                -w "%{http_code}" \
                "${version_url}"
            )"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Deleted ${image}:${tag}"
            else
              echo "Error: DELETE ${version_url} returned HTTP ${http_code}"
              return 1
            fi
          }

          for image in db processing e2e airflow backend; do
            token="$(registry_token "$image")"
            tags="$(
              registry_get "$token" "${image}/tags/list" \
                | jq -r '.tags[]? | select(startswith("ci-"))'
            )"

            while IFS= read -r tag; do
              if [ -z "$tag" ]; then
                continue
              fi

              created_at="$(image_created_at "$token" "$image" "$tag" || true)"
              if [ -z "$created_at" ]; then
                echo "Skipping ${image}:${tag}; could not resolve image creation time"
                continue
              fi

              created_epoch="$(date -u -d "$created_at" +%s)"
              if [ "$created_epoch" -lt "$cutoff_epoch" ]; then
                echo "Removing ${image}:${tag}, created at ${created_at}"
                delete_tag "$image" "$tag"
              else
                echo "Keeping ${image}:${tag}, created at ${created_at}"
              fi
            done <<< "$tags"
          done
