name: Publish

on:
  workflow_call:
    inputs:
      candidate_tag:
        description: Candidate container image tag to publish
        required: true
        type: string
      candidate_sha:
        description: Git SHA matching the candidate images
        required: true
        type: string
      source_event:
        description: Event that produced the candidate images
        required: true
        type: string
      head_branch:
        description: Source branch for notification routing
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-containers:
    runs-on: ubuntu-latest
    env:
      GHCR_PREFIX: ghcr.io/nlsfi/pinta
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Resolve publish tag
        id: publish
        run: |
          set -euo pipefail

          if [ "${{ inputs.source_event }}" = "release" ]; then
            PUBLISH_TAG="$(git tag --points-at HEAD | sort -V | tail -n 1)"
            if [ -z "$PUBLISH_TAG" ]; then
              echo "Could not resolve release tag for ${{ inputs.candidate_sha }}" >&2
              exit 1
            fi
          else
            PUBLISH_TAG="latest"
          fi

          echo "tag=$PUBLISH_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish container images
        run: |
          set -euo pipefail

          PUBLISH_TAG="${{ steps.publish.outputs.tag }}"
          for image in db processing e2e airflow backend; do
            docker buildx imagetools create \
              -t "$GHCR_PREFIX/$image:$PUBLISH_TAG" \
              "$GHCR_PREFIX/$image:$CANDIDATE_TAG"
          done

  notify-teams:
    needs: publish-containers
    if: ${{ always() && needs.publish-containers.result == 'failure' && inputs.head_branch == 'main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Publish
    secrets: inherit
