name: Build Containers

on:
  push:
    branches: [ main ]
    paths: &container_paths
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'infra/containers/**'
      - 'infra/ansible/**'
      - 'components/**'
      - '.github/workflows/build-containers.yml'
      - '.github/workflows/build-container.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/integration-tests.yml'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/publish.yml'
      - 'test_data/**'
  pull_request:
    branches: [ main ]
    paths: *container_paths
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: read
  packages: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      candidate-tag: ${{ steps.image_tag.outputs.candidate-tag }}
      branch-name: ${{ steps.image_tag.outputs.branch-name }}
    steps:
      - name: Resolve image tag
        id: image_tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          CANDIDATE_TAG="ci-${{ github.sha }}"
          BRANCH_NAME="${HEAD_REF:-$REF_NAME}"

          echo "candidate-tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "branch-name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

  build-containers:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - image-name: processing
            registry-image: ghcr.io/nlsfi/pinta/processing
            containerfile: components/processing/Containerfile
            context: .
            target: ''
          - image-name: e2e
            registry-image: ghcr.io/nlsfi/pinta/e2e
            containerfile: components/e2e/Containerfile
            context: .
            target: ''
          - image-name: airflow
            registry-image: ghcr.io/nlsfi/pinta/airflow
            containerfile: components/dags/Containerfile
            context: .
            target: ''
          - image-name: backend
            registry-image: ghcr.io/nlsfi/pinta/backend
            containerfile: components/backend/Containerfile
            context: .
            target: dev
    uses: ./.github/workflows/build-container.yml
    with:
      image-name: ${{ matrix.image-name }}
      registry-image: ${{ matrix.registry-image }}
      containerfile: ${{ matrix.containerfile }}
      context: ${{ matrix.context }}
      target: ${{ matrix.target }}
      tag: ${{ needs.resolve-tag.outputs.candidate-tag }}
      push: true

  build-db:
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: pinta-ci
      COMPOSE_PROFILES: "*"
      GHCR_PREFIX: ghcr.io/nlsfi/pinta
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build DB base image
        run: |
          set -euo pipefail

          docker buildx build --load \
            -f components/db/containers/postgis/Containerfile \
            -t pinta/db:latest \
            --cache-from type=gha,scope=db \
            --cache-to type=gha,scope=db,mode=max \
            components/db/containers/postgis

          # Compose uses GHCR image names, so map local builds to those names.
          docker tag pinta/db:latest "$GHCR_PREFIX/db:latest"

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Start database
        run: make up-db

      - name: Run migrations
        run: make db-migrate-all

      - name: Load test data from test-data image
        run: |
          set -euo pipefail

          set -a
          . .env
          set +a

          DATA_DIR="$(pwd)/test-data"
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"

          docker create --name pinta-test-data-helper --entrypoint sleep --pull always ghcr.io/nlsfi/pinta/test-data:latest infinity
          docker cp pinta-test-data-helper:/data/dem.zip ./data.zip
          docker rm pinta-test-data-helper

          python3 -m zipfile -e data.zip "$DATA_DIR"

          cd components/processing
          uv sync --locked --extra load-test-data

          uv run --extra load-test-data python -m build.load_test_data \
            -c "postgresql+psycopg://${DB_PRIMARY_ADMIN_USER}:${DB_PRIMARY_ADMIN_PASSWORD}@${DB_PRIMARY_HOST}:${DB_PRIMARY_PORT}/${DB_PRIMARY_NAME}" \
            -i "$DATA_DIR"

          rm -rf "$DATA_DIR"

      - name: Commit initialized DB state to image
        run: |
          set -euo pipefail

          # Stop postgres cleanly so the data directory is consistent.
          docker compose exec -T db psql -U postgres -c "CHECKPOINT;"
          docker compose stop db

          # The data lives in a named volume, not the container layer, so we
          # mount it into a fresh helper container and copy it into /pgdata
          # before committing, so the image is self-contained.
          DB_VOLUME="${COMPOSE_PROJECT_NAME}_db-data"
          echo "DB_VOLUME=$DB_VOLUME"

          docker run -d --name pinta-db-committer \
            -v "${DB_VOLUME}:/pgdata-src:ro" \
            --entrypoint sh pinta/db:latest -c "sleep infinity"

          docker exec pinta-db-committer sh -c \
            "cp -a /pgdata-src/. /pgdata/ && rm -f /pgdata/postmaster.pid /pgdata/.s.PGSQL.* && gosu postgres pg_resetwal -f /pgdata"

          docker commit \
            --change 'ENTRYPOINT ["/usr/local/bin/docker-entrypoint.sh"]' \
            --change 'CMD ["postgres"]' \
            pinta-db-committer pinta/db:latest

          docker image inspect pinta/db:latest > /dev/null

      - name: Login to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag DB image for GHCR
        run: |
          set -euo pipefail

          TAG="${{ needs.resolve-tag.outputs.candidate-tag }}"

          docker tag pinta/db:latest "$GHCR_PREFIX/db:$TAG"

      - name: Push DB image to GHCR
        run: |
          set -euo pipefail

          TAG="${{ needs.resolve-tag.outputs.candidate-tag }}"

          docker push "$GHCR_PREFIX/db:$TAG"

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f pinta-db-committer >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans

  e2e:
    needs: [ resolve-tag, build-containers, build-db ]
    uses: ./.github/workflows/e2e.yml
    with:
      candidate_tag: ${{ needs.resolve-tag.outputs.candidate-tag }}
      candidate_sha: ${{ github.sha }}
      source_event: ${{ github.event_name }}
      head_branch: ${{ needs.resolve-tag.outputs.branch-name }}
    secrets: inherit

  integration-tests:
    needs: [ resolve-tag, build-containers ]
    uses: ./.github/workflows/integration-tests.yml
    with:
      candidate_tag: ${{ needs.resolve-tag.outputs.candidate-tag }}
      candidate_sha: ${{ github.sha }}
      head_branch: ${{ needs.resolve-tag.outputs.branch-name }}
    secrets: inherit

  unit-coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component-path: components/backend
            test_folder: test_backend
          - component-path: components/processing
            test_folder: test_processing
          - component-path: components/db
            test_folder: test_db
          - component-path: components/dags
            test_folder: test_dags
    needs: [ resolve-tag ]
    uses: ./.github/workflows/unit-tests.yml
    with:
      component-path: ${{ matrix.component-path }}
      test_folder: ${{ matrix.test_folder }}
      head_branch: ${{ needs.resolve-tag.outputs.branch-name }}

  # QGIS plugin tests across supported QGIS versions
  qgis-tests:
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:${{ matrix.qgis-image-tags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - qgis-image-tags: "3.44.8-noble"
            coverage: true
          - qgis-image-tags: "4.0-questing"
            coverage: false
    env:
      QT_QPA_PLATFORM: offscreen
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Install venv
        run: uv venv --system-site-packages

      - name: Run tests
        working-directory: components/qgis_plugin
        run: |
          uv sync --locked
          if [ "${{ matrix.coverage }}" = "true" ]; then
            uv run coverage run -m pytest -v
          else
            uv run pytest -v
          fi

      - name: Upload coverage fragment
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-qgis
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    needs: [ unit-coverage, integration-tests, qgis-tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Download coverage fragments
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          uvx --from 'coverage[toml]' coverage combine
          uvx --from 'coverage[toml]' coverage xml

      - name: Check coverage on changed lines
        # Thresholds live in the Makefile
        run: |
          git fetch --no-tags origin main
          make coverage-diff

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f diff-cover.md ]; then
            {
              echo "## Coverage on changed lines"
              echo
              cat diff-cover.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diff coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: diff-cover.html
          if-no-files-found: ignore

      - name: Coverage gate help
        if: failure()
        run: |
          echo "::error::Changed-line coverage is below the threshold. See the \
          job summary for the uncovered lines, or download the \
          'diff-cover-report' artifact. Reproduce locally with \
          'make coverage && make coverage-diff' (open htmlcov/index.html for \
          line-level detail)."

  publish:
    needs: [ resolve-tag, e2e, integration-tests ]
    if: ${{ needs.e2e.result == 'success' && needs.integration-tests.result == 'success' && (needs.resolve-tag.outputs.branch-name == 'main' || github.event_name == 'release') }}
    uses: ./.github/workflows/publish.yml
    with:
      candidate_tag: ${{ needs.resolve-tag.outputs.candidate-tag }}
      candidate_sha: ${{ github.sha }}
      source_event: ${{ github.event_name }}
      head_branch: ${{ needs.resolve-tag.outputs.branch-name }}
    secrets: inherit

  notify-teams:
    needs: [ resolve-tag, build-containers, build-db, qgis-tests, coverage-gate ]
    if: ${{ always() && (needs.resolve-tag.result == 'failure' || needs.build-containers.result == 'failure' || needs.build-db.result == 'failure') && needs.resolve-tag.outputs.branch-name == 'main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Build containers
    secrets: inherit
