name: Build Containers

on:
  push:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'infra/containers/**'
      - 'infra/ansible/**'
      - 'components/**/Containerfile'
      - 'components/**/*.sh'
      - '.github/workflows/build-containers.yml'
      - 'components/db/migrations/**'
      - 'test_data/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docker-compose.yml'
      - 'infra/containers/**'
      - 'infra/ansible/**'
      - 'components/**/Containerfile'
      - 'components/**/*.sh'
      - '.github/workflows/build-containers.yml'
      - 'components/db/migrations/**'
      - 'test_data/**'
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: pinta-ci
      COMPOSE_PROFILES: "*"
      GHCR_PREFIX: ghcr.io/nlsfi/pinta
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build all images
        run: |
          set -euo pipefail

          docker buildx build --load \
            -f components/db/containers/postgis/Containerfile \
            -t pinta/db:latest \
            --cache-from type=gha,scope=db \
            --cache-to type=gha,scope=db,mode=max \
            components/db/containers/postgis


          docker buildx build --load \
            -f components/processing/Containerfile \
            -t pinta/processing:latest \
            --cache-from type=gha,scope=processing \
            --cache-to type=gha,scope=processing,mode=max \
            .

          docker buildx build --load \
            -f components/e2e/Containerfile \
            -t pinta/e2e:latest \
            --cache-from type=gha,scope=e2e \
            --cache-to type=gha,scope=e2e,mode=max \
            .

          docker buildx build --load \
            -f components/dags/Containerfile \
            -t pinta/airflow:latest \
            .

          # Compose uses GHCR image names, so map local builds to those names.
          docker tag pinta/db:latest "$GHCR_PREFIX/db:latest"
          docker tag pinta/processing:latest "$GHCR_PREFIX/processing:latest"
          docker tag pinta/e2e:latest "$GHCR_PREFIX/e2e:latest"
          docker tag pinta/airflow:latest "$GHCR_PREFIX/airflow:latest"

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57

      - name: Start database
        run: make up-db

      - name: Run migrations
        run: make db-migrate-all

      - name: Load test data from test-data image
        run: |
          set -euo pipefail

          set -a
          . .env
          set +a

          DATA_DIR="$(pwd)/test-data"
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"

          docker create --name pinta-test-data-helper --entrypoint sleep --pull always ghcr.io/nlsfi/pinta/test-data:latest infinity
          docker cp pinta-test-data-helper:/data ./data.zip
          docker rm pinta-test-data-helper

          python3 -m zipfile -e data.zip "$DATA_DIR"

          cd components/processing
          uv sync --locked --extra load-test-data

          uv run --extra load-test-data python -m build.load_test_data \
            -c "postgresql+psycopg://${DB_PRIMARY_ADMIN_USER}:${DB_PRIMARY_ADMIN_PASSWORD}@${DB_PRIMARY_HOST}:${DB_PRIMARY_PORT}/${DB_PRIMARY_NAME}" \
            -i "$DATA_DIR"

          rm -rf "$DATA_DIR"

      - name: Commit initialized DB state to image
        run: |
          set -euo pipefail

          # Stop postgres cleanly so the data directory is consistent.
          docker compose exec -T db psql -U postgres -c "CHECKPOINT;"
          docker compose stop db

          # The data lives in a named volume, not the container layer, so we
          # mount it into a fresh helper container and copy it into /pgdata
          # before committing, so the image is self-contained.
          DB_VOLUME="${COMPOSE_PROJECT_NAME}_db-data"
          echo "DB_VOLUME=$DB_VOLUME"

          docker run -d --name pinta-db-committer \
            -v "${DB_VOLUME}:/pgdata-src:ro" \
            --entrypoint sh pinta/db:latest -c "sleep infinity"

          docker exec pinta-db-committer sh -c \
            "cp -a /pgdata-src/. /pgdata/ && rm -f /pgdata/postmaster.pid /pgdata/.s.PGSQL.* && gosu postgres pg_resetwal -f /pgdata"

          docker commit \
            --change 'ENTRYPOINT ["/usr/local/bin/docker-entrypoint.sh"]' \
            --change 'CMD ["postgres"]' \
            pinta-db-committer pinta/db:latest

          docker image inspect pinta/db:latest > /dev/null

      - name: Resolve image tag
        id: image_tag
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'release'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag images for GHCR
        run: |
          set -euo pipefail

          TAG="${{ steps.image_tag.outputs.tag }}"

          docker tag pinta/db:latest "$GHCR_PREFIX/db:$TAG"
          docker tag pinta/processing:latest "$GHCR_PREFIX/processing:$TAG"
          docker tag pinta/e2e:latest "$GHCR_PREFIX/e2e:$TAG"
          docker tag pinta/airflow:latest "$GHCR_PREFIX/airflow:$TAG"

      - name: Push images to GHCR
        if: github.event_name == 'push' || github.event_name == 'release'
        run: |
          set -euo pipefail

          TAG="${{ steps.image_tag.outputs.tag }}"

          docker push "$GHCR_PREFIX/db:$TAG"
          docker push "$GHCR_PREFIX/processing:$TAG"
          docker push "$GHCR_PREFIX/e2e:$TAG"
          docker push "$GHCR_PREFIX/airflow:$TAG"

      - name: Show built images
        run: |
          docker image ls --filter reference='pinta/*'
          docker image ls --filter reference="$GHCR_PREFIX/*"

      - name: Cleanup containers
        if: always()
        run: |
          docker rm -f pinta-db-committer >/dev/null 2>&1 || true
          docker compose down -v --remove-orphans

  notify-teams:
    needs: build
    if: ${{ always() && needs.build.result == 'failure' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/notify-teams.yml
    with:
      job_name: Build containers
    secrets: inherit
