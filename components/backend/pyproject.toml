[project]
name = "pinta_backend"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "apache-airflow-client==3.3.1",
  "httpx",
  "jsonschema",
  "pinta-db[psycopg]",
  "pinta-lib",
]

[tool.uv]
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  "httpx",
  "dotenv>=0.9.9",
  "pytest-dotenv>=0.5.2",
  "pytest-xdist>=3.8.0",
  "pytest-mock>=3.15.1",
  "pytest-timeout",
]
lint = [
  "prek",
  "mypy",
  "ruff",
]

[tool.uv.sources]
pinta-lib = { workspace = true }
pinta-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pinta_backend"
include = ["py.typed"]

[tool.ruff]
# Extend the root `pyproject.toml`
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -n auto -p no:pytest-qgis"
timeout = 30

[tool.mypy]
python_version = "3.12"
follow_imports = "normal"
show_column_numbers = true
namespace_packages = true
ignore_missing_imports = true
exclude = "^test"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
commit_message = """\
chore(release): pinta-backend@{version}

Automatically generated by python-semantic-release
"""
tag_format = "pinta-backend-v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "backend"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
# Re-create the changelog from the full history on every release
mode = "init"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "dev"
