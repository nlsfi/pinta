[project]
name = "pinta-processing"
# Version can't be dynamic as docker build layer caching breaks
version = "0.0.0"
description = "Processing component of the elevation production system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "laspy",
  "lazrs",
  "pinta-db[shapely,psycopg]",
  "pinta-lib",
  "affine",
  "geopandas",
  "pandas",
  "rasterio",
  "scipy",
]

[project.urls]
Homepage = "https://github.com/nlsfi/pinta"
Repository = "https://github.com/nlsfi/pinta"
Changelog = "https://github.com/nlsfi/pinta/blob/main/components/processing/CHANGELOG.md/"

[project.optional-dependencies]
load-test-data = ["psycopg"]


[tool.uv]
default-groups = ["development", "linting"]

[dependency-groups]
development = [
  # testing
  "pytest",
  "pytest-mock",
  "pytest-dotenv",
  "pytest-xdist",
  "pytest-timeout",
  "psycopg[binary]",
]
linting = [
  "prek",
  "mypy",
  "ruff",
]

[tool.uv.sources]
pinta-db = { workspace = true }
pinta-lib = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pinta_processing"
include = ["py.typed"]

# extend required for isort action to pick up correct config
[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:pytest-qgis"
timeout = 60

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
commit_message = """\
chore(release): pinta-processing@{version}

Automatically generated by python-semantic-release
"""
tag_format = "pinta-processing-v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "processing"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
# Re-create the changelog from the full history on every release
mode = "init"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "dev"
