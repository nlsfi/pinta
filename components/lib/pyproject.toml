[project]
name = "pinta-lib"
version = "0.0.0"
description = "Common library for the elevation production system"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
]

[project.urls]
Homepage = "https://github.com/nlsfi/pinta"
Repository = "https://github.com/nlsfi/pinta"

[tool.uv]
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
]
lint = [
  "prek",
  "mypy",
  "ruff",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["pinta_test_utils", "pinta_common"]
include = ["py.typed"]

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
commit_message = """\
chore(release): pinta-lib@{version}

Automatically generated by python-semantic-release
"""
tag_format = "pinta-lib-v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "lib"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
# Re-create the changelog from the full history on every release
mode = "init"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "dev"
