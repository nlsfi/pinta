[project]
name = "pinta-dags"
version = "0.0.0"
description = "DAG component of the elevation production system"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pinta-db",
  "pinta-processing",
  "pinta-lib",
]
[project.optional-dependencies]
airflow = [
  "apache-airflow[docker,postgres,standard]==3.3.1",
  "pinta-db[psycopg]",
  "numpy==2.5.1",
  "scipy==1.18.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pinta_dags"
include = ["py.typed"]

[tool.uv.sources]
pinta-processing = { workspace = true }
pinta-db = { workspace = true }
pinta-lib = { workspace = true }

[tool.uv]
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  # Airflow as dev dependency to avoid pinning the version
  # of published dag package to specific airflow version
  # (airflow can be updated without releasing a new version of the dags)

  "pytest-dotenv",
  "pytest-mock",
  "pytest-order",
  "pytest-rerunfailures",
  "pytest-subtests",
  "pytest-timeout",
  "pytest-xdist",
  "coverage-enable-subprocess",
]
lint = [
  "prek",
  "mypy",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = [
  "test",
]
addopts = "-n 0 --import-mode=importlib -p no:pytest-qgis"
timeout = 60

# extend required for isort action to pick up correct config
[tool.ruff]
extend = "../../pyproject.toml"

[tool.semantic_release]
commit_parser = "conventional-monorepo"
major_on_zero = false
allow_zero_version = true
commit_message = """\
chore(release): pinta-dags@{version}

Automatically generated by python-semantic-release
"""
tag_format = "pinta-dags-v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
    set -euo pipefail
    python -m pip install uv
    rm -rf dist
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add ../../uv.lock
    uv build --out-dir dist
"""

[tool.semantic_release.commit_parser_options]
path_filters = ["."]
scope_prefix = "dags"
# Only feat, fix and build (dependency bumps) commits are releasable
minor_tags = ["feat"]
patch_tags = ["fix", "build"]

[tool.semantic_release.changelog]
# Re-create the changelog from the full history on every release
mode = "init"
# Keep only feat and fix commits in the changelog
exclude_commit_patterns = [
  '''(?!(?:feat|fix)(?:\([^)]*?\))?!?: ).*''',
]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "dev"
